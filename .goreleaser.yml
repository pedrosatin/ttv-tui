# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: ttv-tui

before:
  hooks:
    - go mod tidy

builds:
  - id: ttv-tui
    main: ./cmd/ttv-tui
    binary: ttv-tui
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - id: default
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "ttv-tui_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - '{{ if eq .Os "linux" }}packaging/ttv-tui.desktop{{ end }}'
      - '{{ if eq .Os "linux" }}assets/ttv-tui.svg{{ end }}'

checksum:
  name_template: "checksums.txt"
  extra_files:
    - glob: ./dist-window/*.tar.gz
    - glob: ./dist-window/*.zip

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "Merge pull request"
      - "Merge branch"

release:
  github:
    owner: pedrosatin
    name: ttv-tui
  draft: false
  prerelease: auto
  extra_files:
    - glob: ./dist-window/*.tar.gz
    - glob: ./dist-window/*.zip
