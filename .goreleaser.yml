# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: ttv-tui

before:
  hooks:
    - go mod tidy

builds:
  - id: ttv-tui
    main: ./cmd/ttv-tui
    binary: ttv-tui
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - id: default
    formats:
      - tar.gz
    name_template: "ttv-tui_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "Merge pull request"
      - "Merge branch"

release:
  github:
    owner: pedrosatin
    name: ttv-tui
  draft: false
  prerelease: auto
