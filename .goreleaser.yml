# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: ttv-tui

before:
  hooks:
    - go mod tidy -diff

builds:
  - id: ttv-tui
    main: ./cmd/ttv-tui
    binary: ttv-tui
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    # Roda o binário do host com --version e exige "ttv-tui <versão>" antes de empacotar e publicar.
    hooks:
      post:
        - cmd: >-
            {{ if and (eq .Os .Runtime.Goos) (eq .Arch .Runtime.Goarch) }}sh -ec 'scratch=$(mktemp -d); trap "rm -rf \"$scratch\"" EXIT; export XDG_CONFIG_HOME="$scratch/config" XDG_STATE_HOME="$scratch/state"; output=$("{{ .Path }}" --version); echo "Versão injetada -> $output"; test "$output" = "ttv-tui {{ .Version }}"; touch "$(dirname "$(dirname "{{ .Path }}")")/version-checked"'
            {{ else }}true{{ end }}
          output: true
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - id: default
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "ttv-tui_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - '{{ if eq .Os "linux" }}packaging/ttv-tui.desktop{{ end }}'
      - '{{ if eq .Os "linux" }}assets/ttv-tui.svg{{ end }}'

checksum:
  name_template: "checksums.txt"
  extra_files:
    - glob: ./dist-window/*.tar.gz
    - glob: ./dist-window/*.zip
    # Fontes LGPL do zip da janela Windows (mpv, FFmpeg, libiconv + PKGBUILD).
    - glob: ./dist-window/lgpl-sources/*

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "Merge pull request"
      - "Merge branch"

release:
  github:
    owner: pedrosatin
    name: ttv-tui
  draft: false
  prerelease: auto
  extra_files:
    - glob: ./dist-window/*.tar.gz
    - glob: ./dist-window/*.zip
    - glob: ./dist-window/lgpl-sources/*
  # Checklist do FFmpeg (ffmpeg.org/legal.html): aviso LGPL na página de download.
  # O build embutido na libmpv LGPL usa --enable-version3, então o aviso cita LGPLv3.
  footer: |
    ---

    This software uses code of [FFmpeg](https://ffmpeg.org) licensed under the [LGPLv3](https://www.gnu.org/licenses/lgpl-3.0.html). The matching FFmpeg source, together with the mpv and libiconv sources for the Windows window zip, is attached to this release (`FFmpeg-*.tar.gz`, `mpv-v*.tar.gz`, `libiconv-*.tar.gz`, `SHA256SUMS`). See `THIRD-PARTY.txt` inside `ttv-tui-window_*_windows_amd64.zip`.

# Fórmula Homebrew: binários das releases (Darwin e Linux). A v0.10.2 já
# publica ttv-tui_*_darwin_{arm64,amd64}.tar.gz; compilar do fonte fica de fora.
# Publicação no tap só com tag v* (deploy key). Snapshot gera o .rb em dist/
# sem escrever no repositório.
brews:
  - name: ttv-tui
    ids:
      - default
    homepage: "https://github.com/pedrosatin/ttv-tui"
    description: "Browse and watch Twitch in the terminal"
    license: MIT
    directory: Formula
    commit_msg_template: "ttv-tui {{ .Tag }}"
    skip_upload: "{{ .IsSnapshot }}"
    dependencies:
      - name: mpv
      - name: streamlink
    test: |
      assert_match "ttv-tui", shell_output("#{bin}/ttv-tui --help")
    repository:
      owner: pedrosatin
      name: homebrew-tap
      branch: main
      git:
        # Vazio no snapshot: o GoReleaser não clona nem faz push no tap.
        url: "{{ if .IsSnapshot }}{{ else }}ssh://git@github.com/pedrosatin/homebrew-tap.git{{ end }}"
        # Caminho para o arquivo da chave (nunca o conteúdo inline).
        private_key: "{{ .Env.HOMEBREW_TAP_KEY_PATH }}"

# Manifesto Scoop: zip Windows da release, com mpv e streamlink via depends.
# Mesma regra de publicação do brew (só tag v*, deploy key).
scoops:
  - name: ttv-tui
    ids:
      - default
    homepage: "https://github.com/pedrosatin/ttv-tui"
    description: "Terminal UI for Twitch"
    license: MIT
    commit_msg_template: "ttv-tui {{ .Tag }}"
    skip_upload: "{{ .IsSnapshot }}"
    depends:
      - extras/mpv
      - extras/streamlink
    repository:
      owner: pedrosatin
      name: scoop-bucket
      branch: main
      git:
        url: "{{ if .IsSnapshot }}{{ else }}ssh://git@github.com/pedrosatin/scoop-bucket.git{{ end }}"
        private_key: "{{ .Env.SCOOP_BUCKET_KEY_PATH }}"
