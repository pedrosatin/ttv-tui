# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: ttv-tui

before:
  hooks:
    - go mod tidy -diff

builds:
  - id: ttv-tui
    main: ./cmd/ttv-tui
    binary: ttv-tui
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    # Roda o binário do host com --version e exige "ttv-tui <versão>" antes de empacotar e publicar.
    hooks:
      post:
        - cmd: >-
            {{ if and (eq .Os .Runtime.Goos) (eq .Arch .Runtime.Goarch) }}sh -ec 'scratch=$(mktemp -d); trap "rm -rf \"$scratch\"" EXIT; export XDG_CONFIG_HOME="$scratch/config" XDG_STATE_HOME="$scratch/state"; output=$("{{ .Path }}" --version); echo "Versão injetada -> $output"; test "$output" = "ttv-tui {{ .Version }}"; touch "$(dirname "$(dirname "{{ .Path }}")")/version-checked"'
            {{ else }}true{{ end }}
          output: true
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - id: default
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "ttv-tui_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - '{{ if eq .Os "linux" }}packaging/ttv-tui.desktop{{ end }}'
      - '{{ if eq .Os "linux" }}assets/ttv-tui.svg{{ end }}'

checksum:
  name_template: "checksums.txt"
  extra_files:
    - glob: ./dist-window/*.tar.gz
    - glob: ./dist-window/*.zip

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "Merge pull request"
      - "Merge branch"

release:
  github:
    owner: pedrosatin
    name: ttv-tui
  draft: false
  prerelease: auto
  extra_files:
    - glob: ./dist-window/*.tar.gz
    - glob: ./dist-window/*.zip
