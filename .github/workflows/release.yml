name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # The window links SDL3 and libmpv, so it builds where those are packaged.
  window:
    name: Window binary
    runs-on: ubuntu-latest
    # .github/images/arch-ci/README.md explains how to renew this digest.
    container: ghcr.io/pedrosatin/ttv-tui-arch-ci@sha256:8da8d3f4904a0060d443feb4580f687b77f86fda9b9d5c370723021c884bb411
    steps:
      - name: List the native package versions
        run: |
          pacman -Q sdl3 mpv gcc pkgconf
          echo "sdl3 $(pkg-config --modversion sdl3), mpv $(pkg-config --modversion mpv)"

      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: window/go.mod
          cache: false

      - name: Build
        working-directory: window
        run: go build -buildvcs=false -trimpath -ldflags "-s -w" -o ttv-tui-window .

      - name: Package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist-window
          tar -czf "dist-window/ttv-tui-window_${VERSION}_linux_amd64.tar.gz" -C window ttv-tui-window

      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: window
          path: dist-window/

  # Windows has no system SDL3 or libmpv. The zip carries the official LGPL libmpv-2.dll and MSYS2 runtime DLLs.
  # The MSYS2 mpv package stays installed so this job matches the CI job that tests the script; the script
  # makes pkg-config resolve the official mpv.pc and fails otherwise.
  window-windows:
    name: Window binary (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install build dependencies
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: UCRT64
          path-type: inherit
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-sdl3
            mingw-w64-ucrt-x86_64-mpv
            mingw-w64-ucrt-x86_64-ntldd
            unzip
            zip

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: window/go.mod
          cache: false

      - name: Build and package
        shell: msys2 {0}
        env:
          CGO_ENABLED: "1"
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist-window
          packaging/window-windows.sh "dist-window/ttv-tui-window_${VERSION}_windows_amd64.zip"

      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: window-windows
          path: dist-window/

  goreleaser:
    name: Release
    needs: [window, window-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.4'
          cache: false

      - name: Download window binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: window*
          merge-multiple: true
          path: dist-window

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.20.2
          args: release --clean
        env:
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Require host version check
        run: test -f dist/version-checked
