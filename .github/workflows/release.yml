name: Release

on:
  push:
    tags:
      - 'v*'
  # Ensaio sem tag: mesmos jobs, GoReleaser em snapshot sem publicar.
  # Uma tag v* continua sendo o único caminho que publica a release.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The window links SDL3 and libmpv, so it builds where those are packaged.
  window:
    name: Window binary
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # .github/images/arch-ci/README.md explains how to renew this digest.
    container: ghcr.io/pedrosatin/ttv-tui-arch-ci@sha256:8da8d3f4904a0060d443feb4580f687b77f86fda9b9d5c370723021c884bb411
    steps:
      - name: List the native package versions
        run: |
          pacman -Q sdl3 mpv gcc pkgconf
          echo "sdl3 $(pkg-config --modversion sdl3), mpv $(pkg-config --modversion mpv)"

      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: window/go.mod
          cache: false

      # Go's build cache does not hash the C headers and libraries cgo compiles
      # against, so the key carries the installed SDL3, mpv, GCC and pkgconf.
      # The prefix names the release trimpath build of the window module.
      - name: Key the window Go cache
        id: go-cache-key
        run: |
          manifest=$(pacman -Q sdl3 mpv gcc pkgconf)
          echo "$manifest"
          native=$(printf '%s\n' "$manifest" | sha256sum | cut -c1-16)
          {
            echo "prefix=go-window-release-${RUNNER_OS}-${RUNNER_ARCH}-$(go env GOVERSION)-native-${native}-"
            echo "gocache=$(go env GOCACHE)"
            echo "gomodcache=$(go env GOMODCACHE)"
          } >> "$GITHUB_OUTPUT"

      - name: Restore the window Go cache
        id: go-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.go-cache-key.outputs.gocache }}
            ${{ steps.go-cache-key.outputs.gomodcache }}
          key: ${{ steps.go-cache-key.outputs.prefix }}${{ hashFiles('window/go.sum') }}
          restore-keys: ${{ steps.go-cache-key.outputs.prefix }}

      - name: Build
        working-directory: window
        run: go build -buildvcs=false -trimpath -ldflags "-s -w" -o ttv-tui-window .

      - name: Save the window Go cache
        if: steps.go-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.go-cache-key.outputs.gocache }}
            ${{ steps.go-cache-key.outputs.gomodcache }}
          key: ${{ steps.go-cache-key.outputs.prefix }}${{ hashFiles('window/go.sum') }}

      - name: Package
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == push && "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="snapshot"
          fi
          mkdir -p dist-window
          tar -czf "dist-window/ttv-tui-window_${VERSION}_linux_amd64.tar.gz" -C window ttv-tui-window

      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: window
          path: dist-window/

  # Windows has no system SDL3 or libmpv. The zip carries the official LGPL libmpv-2.dll and MSYS2 runtime DLLs.
  # The MSYS2 mpv package stays installed so this job matches the CI job that tests the script; the script
  # makes pkg-config resolve the official mpv.pc and fails otherwise.
  # Go cache and packaging timeouts match the Window (windows-latest) job in ci.yml.
  window-windows:
    name: Window binary (Windows)
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install build dependencies
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: UCRT64
          path-type: inherit
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-sdl3
            mingw-w64-ucrt-x86_64-mpv
            mingw-w64-ucrt-x86_64-ntldd
            unzip
            zip

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: window/go.mod
          cache: false

      - name: Key the window Go cache
        id: go-cache-key
        shell: msys2 {0}
        run: |
          manifest=$(pacman -Q mingw-w64-ucrt-x86_64-sdl3 mingw-w64-ucrt-x86_64-mpv \
            mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-pkgconf)
          echo "$manifest"
          echo "gcc $(gcc -dumpfullversion), pkg-config $(pkg-config --version)," \
            "sdl3 $(pkg-config --modversion sdl3), mpv $(pkg-config --modversion mpv)"
          native=$(printf '%s\n' "$manifest" | sha256sum | cut -c1-16)
          {
            echo "prefix=go-window-zip-${RUNNER_OS}-${RUNNER_ARCH}-$(go env GOVERSION)-native-${native}-"
            echo "gocache=$(go env GOCACHE)"
            echo "gomodcache=$(go env GOMODCACHE)"
          } >> "$GITHUB_OUTPUT"

      - name: Restore the window Go cache
        id: go-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.go-cache-key.outputs.gocache }}
            ${{ steps.go-cache-key.outputs.gomodcache }}
          key: ${{ steps.go-cache-key.outputs.prefix }}${{ hashFiles('window/go.sum') }}
          restore-keys: ${{ steps.go-cache-key.outputs.prefix }}

      - name: Build and package
        shell: msys2 {0}
        timeout-minutes: 6
        env:
          CGO_ENABLED: "1"
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == push && "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="snapshot"
          fi
          mkdir -p dist-window
          packaging/window-windows.sh "dist-window/ttv-tui-window_${VERSION}_windows_amd64.zip"

      # Saved after packaging so the cache holds the -trimpath objects that the
      # zip build produces. Same prefix as the CI Window (windows-latest) job.
      - name: Save the window Go cache
        if: steps.go-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.go-cache-key.outputs.gocache }}
            ${{ steps.go-cache-key.outputs.gomodcache }}
          key: ${{ steps.go-cache-key.outputs.prefix }}${{ hashFiles('window/go.sum') }}

      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: window-windows
          path: dist-window/

  goreleaser:
    name: Release
    needs: [window, window-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.4'
          cache: true

      - name: Download window binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: window*
          merge-multiple: true
          path: dist-window

      # Deploy keys só na publicação por tag. O ensaio (workflow_dispatch) não
      # recebe as chaves e o GoReleaser roda com --skip=publish; o tap e o
      # bucket não são escritos. Caminhos vazios no ensaio evitam falha do
      # template {{ .Env.*_KEY_PATH }} sem a variável definida.
      - name: Prepare tap and bucket key paths
        env:
          PUBLISH: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
          # Segredos só entram no ambiente na publicação por tag.
          HOMEBREW_TAP_DEPLOY_KEY: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && secrets.HOMEBREW_TAP_DEPLOY_KEY || '' }}
          SCOOP_BUCKET_DEPLOY_KEY: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && secrets.SCOOP_BUCKET_DEPLOY_KEY || '' }}
        run: |
          set -euo pipefail
          if [[ "$PUBLISH" == true ]]; then
            umask 077
            printf '%s\n' "$HOMEBREW_TAP_DEPLOY_KEY" > "$RUNNER_TEMP/homebrew_tap_key"
            printf '%s\n' "$SCOOP_BUCKET_DEPLOY_KEY" > "$RUNNER_TEMP/scoop_bucket_key"
            {
              echo "HOMEBREW_TAP_KEY_PATH=$RUNNER_TEMP/homebrew_tap_key"
              echo "SCOOP_BUCKET_KEY_PATH=$RUNNER_TEMP/scoop_bucket_key"
            } >> "$GITHUB_ENV"
          else
            {
              echo "HOMEBREW_TAP_KEY_PATH="
              echo "SCOOP_BUCKET_KEY_PATH="
            } >> "$GITHUB_ENV"
          fi

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.20.2
          args: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && 'release --clean' || 'release --snapshot --clean --skip=publish' }}
        env:
          GORELEASER_CURRENT_TAG: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # HOMEBREW_TAP_KEY_PATH e SCOOP_BUCKET_KEY_PATH vêm do GITHUB_ENV
          # do passo anterior (caminho do arquivo na tag; vazios no ensaio).

      - name: Require host version check
        run: test -f dist/version-checked

      # No ensaio (workflow_dispatch), confere que o conjunto de artefatos
      # normalizado bate com a última release publicada. Checksums e binários
      # diferem por versão e ldflags; o que importa é o inventário.
      - name: Compare snapshot artifacts with latest release
        if: ${{ !(github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          normalize() {
            # ttv-tui_0.10.2_linux_amd64.tar.gz -> ttv-tui_*_linux_amd64.tar.gz
            # ttv-tui-window_snapshot_windows_amd64.zip -> ttv-tui-window_*_windows_amd64.zip
            sed -E \
              -e 's/ttv-tui_[^_]+_/ttv-tui_*_/' \
              -e 's/ttv-tui-window_[^_]+_/ttv-tui-window_*_/'
          }
          mkdir -p /tmp/release-compare
          gh release view --json assets --jq '.assets[].name' | sort > /tmp/release-compare/latest.txt
          {
            find dist -maxdepth 1 -type f \( -name 'ttv-tui_*' -o -name 'checksums.txt' \) -printf '%f\n'
            find dist-window -maxdepth 1 -type f -name 'ttv-tui-window_*' -printf '%f\n'
          } | sort > /tmp/release-compare/snapshot-raw.txt
          normalize < /tmp/release-compare/latest.txt | sort -u > /tmp/release-compare/latest-n.txt
          normalize < /tmp/release-compare/snapshot-raw.txt | sort -u > /tmp/release-compare/snapshot-n.txt
          echo "Última release (normalizada):"
          cat /tmp/release-compare/latest-n.txt
          echo "Snapshot (normalizado):"
          cat /tmp/release-compare/snapshot-n.txt
          if ! diff -u /tmp/release-compare/latest-n.txt /tmp/release-compare/snapshot-n.txt; then
            echo "Inventário de artefatos difere da última release." >&2
            exit 1
          fi
          echo "Inventário de artefatos igual ao da última release (versão normalizada)."

      # Ensaio: fórmula e manifesto gerados, mais os arquivos citados neles,
      # para conferir hashes e tentar brew/scoop install sem publicar.
      - name: Stage packaging snapshot artifacts
        if: ${{ !(github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) }}
        run: |
          set -euo pipefail
          mkdir -p packaging-snapshot/homebrew/Formula packaging-snapshot/scoop
          cp dist/checksums.txt packaging-snapshot/
          cp dist/homebrew/Formula/ttv-tui.rb packaging-snapshot/homebrew/Formula/
          cp dist/scoop/ttv-tui.json packaging-snapshot/scoop/
          cp dist/ttv-tui_*_darwin_*.tar.gz packaging-snapshot/
          cp dist/ttv-tui_*_windows_*.zip packaging-snapshot/
          find packaging-snapshot -type f | sort

      - name: Upload packaging snapshot artifacts
        if: ${{ !(github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packaging-snapshot
          path: packaging-snapshot/

  # Confere a fórmula gerada no ensaio: hashes contra checksums.txt e
  # brew install com URL file:// dos arquivos locais (sem tocar no tap).
  brew-formula-check:
    name: Brew formula (snapshot)
    if: ${{ !(github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) }}
    needs: [goreleaser]
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Download packaging snapshot
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packaging-snapshot
          path: packaging-snapshot

      - name: Verify formula hashes against checksums.txt
        run: |
          set -euo pipefail
          formula=packaging-snapshot/homebrew/Formula/ttv-tui.rb
          checksums=packaging-snapshot/checksums.txt
          test -f "$formula"
          test -f "$checksums"
          echo "Fórmula gerada:"
          cat "$formula"
          # Cada sha256 da fórmula deve aparecer no checksums.txt ao lado de
          # um arquivo darwin citado na mesma fórmula.
          while read -r hash; do
            [[ -n "$hash" ]] || continue
            if ! grep -E "^${hash}[[:space:]]" "$checksums"; then
              echo "Hash $hash da fórmula não está em checksums.txt" >&2
              exit 1
            fi
          done < <(grep -E '^\s*sha256 "' "$formula" | sed -E 's/.*"([0-9a-f]{64})".*/\1/')
          echo "Hashes da fórmula conferem com checksums.txt."

      - name: Install from local formula
        run: |
          set -euo pipefail
          formula=packaging-snapshot/homebrew/Formula/ttv-tui.rb
          abs=$(cd packaging-snapshot && pwd)
          # Snapshot aponta para URLs de release inexistentes; troca por file://
          # dos tarballs locais. A fórmula é de binário, então
          # --build-from-source não se aplica.
          ruby - "$formula" "$abs" <<'RUBY'
          formula, root = ARGV
          text = File.read(formula)
          text = text.gsub(%r{https://github\.com/pedrosatin/ttv-tui/releases/download/[^"]+/([^"]+)}) do
            name = Regexp.last_match(1)
            file = File.join(root, name)
            # Só reescreve os arquivos presentes no artefato (Darwin neste job).
            File.file?(file) ? "file://#{file}" : Regexp.last_match(0)
          end
          File.write(formula, text)
          RUBY
          # O Homebrew só instala fórmula de dentro de um tap: monta um tap
          # local descartável com a fórmula gerada.
          brew tap-new --no-git local/ttv-tui-snapshot
          tap_dir="$(brew --repository)/Library/Taps/local/homebrew-ttv-tui-snapshot"
          cp "$formula" "$tap_dir/Formula/ttv-tui.rb"
          brew install --formula local/ttv-tui-snapshot/ttv-tui
          brew test local/ttv-tui-snapshot/ttv-tui
          ttv-tui --help 2>&1 | grep -F ttv-tui
          brew uninstall ttv-tui
          brew untap local/ttv-tui-snapshot

  # Confere o manifesto Scoop no ensaio: hashes e scoop install local,
  # sem escrever no bucket.
  scoop-manifest-check:
    name: Scoop manifest (snapshot)
    if: ${{ !(github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) }}
    needs: [goreleaser]
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Download packaging snapshot
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packaging-snapshot
          path: packaging-snapshot

      - name: Verify manifest hashes and install locally
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $manifest = 'packaging-snapshot/scoop/ttv-tui.json'
          $checksums = 'packaging-snapshot/checksums.txt'
          if (-not (Test-Path $manifest)) { throw "manifest missing: $manifest" }
          if (-not (Test-Path $checksums)) { throw "checksums missing: $checksums" }
          Get-Content $manifest
          $json = Get-Content $manifest -Raw | ConvertFrom-Json
          $checksumMap = @{}
          Get-Content $checksums | ForEach-Object {
            if ($_ -match '^([0-9a-fA-F]{64})\s+(\S+)$') {
              $checksumMap[$Matches[2]] = $Matches[1].ToLowerInvariant()
            }
          }
          $root = (Resolve-Path 'packaging-snapshot').Path
          foreach ($arch in @('64bit', 'arm64')) {
            $entry = $json.architecture.$arch
            if ($null -eq $entry) { continue }
            $url = [string]$entry.url
            $name = Split-Path -Leaf ($url -replace '\?.*$', '')
            $want = [string]$entry.hash
            if (-not $checksumMap.ContainsKey($name)) {
              throw "checksums.txt sem entrada para $name"
            }
            if ($checksumMap[$name] -ne $want.ToLowerInvariant()) {
              throw "hash do manifesto ($want) difere de checksums.txt ($($checksumMap[$name])) para $name"
            }
            $local = Join-Path $root $name
            if (-not (Test-Path $local)) { throw "zip ausente: $local" }
            $entry.url = (Resolve-Path $local).Path
          }
          if ($null -eq $json.depends -or $json.depends.Count -lt 2) {
            throw 'manifesto sem depends (mpv/streamlink)'
          }
          $json | ConvertTo-Json -Depth 10 | Set-Content -Path $manifest -Encoding utf8
          Write-Host 'Hashes do manifesto conferem com checksums.txt.'

          if (-not (Get-Command scoop -ErrorAction SilentlyContinue)) {
            Set-ExecutionPolicy -Scope CurrentUser RemoteSigned -Force
            Invoke-RestMethod -Uri https://get.scoop.sh -OutFile install-scoop.ps1
            & .\install-scoop.ps1 -RunAsAdmin:$false
            $env:Path = "$env:USERPROFILE\scoop\shims;$env:Path"
          }
          # Confirma depends no manifesto; a instalação local resolve mpv e
          # streamlink pelo bucket extras.
          scoop bucket add extras
          scoop install (Resolve-Path $manifest).Path
          # A saída tem várias linhas: junta antes de comparar, senão o
          # -notmatch devolve as linhas que não casam e o if sempre dispara.
          $help = (& ttv-tui --help) -join "`n"
          if ($LASTEXITCODE -ne 0) { throw "ttv-tui --help failed: $LASTEXITCODE" }
          if ($help -notmatch 'ttv-tui') { throw "ttv-tui --help sem o nome do app: $help" }
          Write-Host $help
          scoop uninstall ttv-tui
