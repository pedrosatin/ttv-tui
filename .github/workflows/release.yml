name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # The window links SDL3 and libmpv, so it builds where those are packaged.
  window:
    name: Window binary
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install build dependencies
        run: pacman -Syu --noconfirm git gcc pkgconf sdl3 mpv libglvnd mesa tar gzip

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: window/go.mod
          cache: false

      - name: Build
        working-directory: window
        run: go build -buildvcs=false -trimpath -ldflags "-s -w" -o ttv-tui-window .

      - name: Package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist-window
          tar -czf "dist-window/ttv-tui-window_${VERSION}_linux_amd64.tar.gz" -C window ttv-tui-window

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: window
          path: dist-window/

  # Windows has no system SDL3 or libmpv, so the zip carries the MSYS2 DLLs.
  window-windows:
    name: Window binary (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          path-type: inherit
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-sdl3
            mingw-w64-ucrt-x86_64-mpv
            mingw-w64-ucrt-x86_64-ntldd
            unzip
            zip

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: window/go.mod
          cache: false

      - name: Build and package
        shell: msys2 {0}
        env:
          CGO_ENABLED: "1"
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist-window
          packaging/window-windows.sh "dist-window/ttv-tui-window_${VERSION}_windows_amd64.zip"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: window-windows
          path: dist-window/

  goreleaser:
    name: Release
    needs: [window, window-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download window binaries
        uses: actions/download-artifact@v4
        with:
          pattern: window*
          merge-multiple: true
          path: dist-window

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6.1.0
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify injected version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ARCHIVE="dist/ttv-tui_${VERSION}_linux_amd64.tar.gz"
          echo "Verificando o arquivo $ARCHIVE"
          tar -xzf "$ARCHIVE" -C /tmp ttv-tui
          OUTPUT=$(/tmp/ttv-tui --version)
          echo "Saída de ttv-tui --version: $OUTPUT"
          echo "$OUTPUT" | grep -F "$VERSION"
