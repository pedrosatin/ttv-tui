name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    name: Build, Lint & Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TMPDIR: /tmp
      XDG_RUNTIME_DIR: /tmp
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build packages
        run: go build ./...

      - name: Run go vet
        run: go vet ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.15.0

      - name: Run tests
        run: go test -count=1 ./...

      - name: Run race detector on concurrent packages
        run: go test -race -count=1 ./internal/player ./internal/chat ./internal/ui ./internal/store

  # Proves on every push that the app and its tests compile on each OS, and that
  # the suite runs there. No job needs mpv, streamlink or the network.
  portability:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: macos-latest
          - os: windows-latest
            # These read a real cookie database through the sqlite3 binary, and this
            # job must not depend on one being on the runner.
            test-skip: '^(TestExtractChromium_|TestExtractFirefox_|TestCopyCookieDB_)'
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # The default macOS TMPDIR is too long for a Unix socket path.
      - name: Use short temp paths
        if: runner.os != 'Windows'
        run: |
          echo "TMPDIR=/tmp" >> "$GITHUB_ENV"
          echo "XDG_RUNTIME_DIR=/tmp" >> "$GITHUB_ENV"

      - name: Build packages
        run: go build ./...

      - name: Run go vet (production and tests)
        run: go vet ./...

      - name: Build for an unsupported Unix
        if: runner.os == 'Linux'
        run: GOOS=freebsd GOARCH=amd64 go build ./...

      - name: Run tests
        run: go test -count=1 -skip '${{ matrix.test-skip }}' ./...
