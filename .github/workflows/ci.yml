name: CI

on:
  push:
  pull_request:

jobs:
  govulncheck:
    name: Govulncheck (root and window)
    runs-on: ubuntu-latest
    container: archlinux:latest
    timeout-minutes: 15
    steps:
      - name: Install window build dependencies
        run: pacman -Syu --noconfirm git gcc pkgconf sdl3 mpv libglvnd
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.27.4'
          cache: false
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      - name: Check root module
        env:
          CGO_ENABLED: "0"
        run: |
          govulncheck ./...
          GOOS=windows govulncheck ./...
          GOOS=darwin govulncheck ./...
      - name: Set up window Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: window/go.mod
          cache: false
      - name: Check window module
        working-directory: window
        run: govulncheck ./...

  ci:
    name: Build, Lint & Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TMPDIR: /tmp
      XDG_RUNTIME_DIR: /tmp
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.27.4'
          cache: true

      - name: Check module tidiness
        run: go mod tidy -diff

      - name: Build packages
        run: go build ./...

      - name: Run go vet
        run: go vet ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@9fae48acfc02a90574d7c304a1758ef9895495fa # v7.0.1
        with:
          version: v2.15.0

      - name: Run tests
        run: go test -count=1 ./...

      - name: Run race detector on concurrent packages
        run: go test -race -count=1 ./internal/player ./internal/chat ./internal/kick ./internal/ui ./internal/store

      - name: Check Linux installer offline
        run: |
          shellcheck packaging/install.sh packaging/install_test.sh
          bash packaging/install_test.sh

  # The window is its own module: it links SDL3 and libmpv, which only some
  # systems package, so the rest of the build never depends on it.
  window:
    name: Window (Arch)
    runs-on: ubuntu-latest
    container: archlinux:latest
    timeout-minutes: 15
    steps:
      - name: Install build dependencies
        run: pacman -Syu --noconfirm git gcc pkgconf sdl3 mpv libglvnd mesa ttf-dejavu noto-fonts-emoji

      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: window/go.mod
          cache: false

      - name: Build, vet and test
        working-directory: window
        run: |
          go mod tidy -diff
          go build -tags windowtest -buildvcs=false -o /tmp/ttv-tui-window .
          go vet ./...
          go vet -tags windowtest ./...
          go test -buildvcs=false ./...
          go test -tags windowtest -buildvcs=false ./...

      # A janela real, offscreen no llvmpipe do mesa, com GQL, IRC e vídeo de
      # fixture: sem compositor, sem live e sem rede. Cenário marcado com bug
      # conhecido (W1, W4…) aparece como SKIP até a correção chegar.
      - name: Window UX scenarios (offscreen)
        env:
          TMPDIR: /tmp
        run: |
          go vet -tags cenarios ./tools/window-scenarios
          go test -tags cenarios -count=1 -parallel 3 -v ./tools/window-scenarios

  # The release ships the window only for Linux (ADR 0012). These builds keep the
  # Windows (MSYS2 UCRT64) and macOS (Homebrew) code compiling and its tests running.
  window-other:
    name: Window (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install SDL3 and libmpv (macOS)
        if: runner.os == 'macOS'
        run: brew install pkgconf sdl3 mpv

      - name: Install SDL3 and libmpv (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: UCRT64
          path-type: inherit
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-sdl3
            mingw-w64-ucrt-x86_64-mpv
            mingw-w64-ucrt-x86_64-ntldd
            unzip
            zip

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: window/go.mod
          cache: false

      # The default macOS TMPDIR is too long for a Unix socket path.
      - name: Build, vet and test (macOS)
        if: runner.os == 'macOS'
        working-directory: window
        env:
          TMPDIR: /tmp
        run: |
          go mod tidy -diff
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          govulncheck ./...
          go build -buildvcs=false -o ttv-tui-window .
          go vet ./...
          go test -buildvcs=false ./...

      - name: Build, vet and test (Windows)
        if: runner.os == 'Windows'
        working-directory: window
        shell: msys2 {0}
        env:
          CGO_ENABLED: "1"
        run: |
          go mod tidy -diff
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          govulncheck ./...
          go build -buildvcs=false -o ttv-tui-window.exe .
          go vet ./...
          go test -buildvcs=false ./...

      - name: Package the Windows zip
        if: runner.os == 'Windows'
        shell: msys2 {0}
        env:
          CGO_ENABLED: "1"
        run: |
          mkdir -p dist-window
          packaging/window-windows.sh dist-window/ttv-tui-window.zip

      # Without MSYS2 on PATH, a DLL missing from the zip stops the process before
      # main. Any other probe result is fine: the runner may lack a usable GPU.
      - name: Check the zip loads without MSYS2
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 3
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'window-zip'
          Expand-Archive -LiteralPath dist-window/ttv-tui-window.zip -DestinationPath $dir
          $allowedDlls = @('libmpv-2.dll', 'SDL3.dll', 'libiconv-2.dll')
          $packagedDlls = Get-ChildItem -Path (Join-Path $dir 'ttv-tui-window') -Filter '*.dll' | Select-Object -ExpandProperty Name
          $unexpected = $packagedDlls | Where-Object { $_ -notin $allowedDlls }
          if ($unexpected) {
            throw "Unexpected DLLs found in zip: $($unexpected -join ', ') (allowed: $($allowedDlls -join ', '))"
          }
          $missing = $allowedDlls | Where-Object { $_ -notin $packagedDlls }
          if ($missing) {
            throw "Missing required DLLs in zip: $($missing -join ', ')"
          }
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          $exe = Join-Path $dir 'ttv-tui-window\ttv-tui-window.exe'
          $p = Start-Process -FilePath $exe -ArgumentList '--probe' -Wait -PassThru -NoNewWindow
          Write-Host "probe exit code: $($p.ExitCode)"
          if ($p.ExitCode -eq -1073741515) { throw 'A DLL is missing from the zip (STATUS_DLL_NOT_FOUND).' }
          if ($p.ExitCode -eq -1073741511) { throw 'A DLL in the zip lacks an entry point (STATUS_ENTRYPOINT_NOT_FOUND).' }

      # Lets a branch be tried on a real Windows before a release has the zip.
      - name: Upload the Windows zip
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ttv-tui-window-windows
          path: dist-window/ttv-tui-window.zip
          if-no-files-found: error
          retention-days: 7

  # Proves on every push that the app and its tests compile on each OS, and that
  # the suite runs there. The suite needs neither mpv nor streamlink; only the
  # Windows handshake step below uses a real mpv.
  portability:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.27.4'
          cache: true

      # The default macOS TMPDIR is too long for a Unix socket path.
      - name: Use short temp paths
        if: runner.os != 'Windows'
        run: |
          echo "TMPDIR=/tmp" >> "$GITHUB_ENV"
          echo "XDG_RUNTIME_DIR=/tmp" >> "$GITHUB_ENV"

      - name: Parse Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'packaging/install.ps1'), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }

      - name: Check Windows installer dry run
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $output = & ./packaging/install.ps1 -DryRun -Version 0.2.0 6>&1 | Out-String
          Write-Host $output
          if ($output -notmatch 'Plan: version 0\.2\.0' -or
              $output -notmatch 'ttv-tui_0\.2\.0_windows_amd64\.zip' -or
              $output -notmatch 'checksums\.txt' -or
              $output -notmatch 'Verify SHA-256') { throw 'Unexpected installer dry run output' }

      - name: Build packages
        run: go build ./...

      - name: Run go vet (production and tests)
        run: go vet ./...

      - name: Build for an unsupported Unix
        if: runner.os == 'Linux'
        run: GOOS=freebsd GOARCH=amd64 go build ./...

      - name: Run tests
        run: go test -count=1 ./...

      # Installing depends on a third-party mirror, so a failed install only skips
      # the check. Chocolatey edits the machine PATH, which the running shell never
      # sees, so the next step finds mpv.exe and hands its directory to later steps.
      - name: Install mpv
        id: mpv
        if: runner.os == 'Windows'
        continue-on-error: true
        timeout-minutes: 4
        run: choco install mpv --no-progress -y

      - name: Put mpv on PATH
        id: mpvpath
        if: runner.os == 'Windows' && steps.mpv.outcome == 'success'
        timeout-minutes: 2
        run: |
          choco_root="${ChocolateyInstall:-C:\\ProgramData\\chocolatey}"
          root="$(cygpath -u "$choco_root")"
          for dir in "$root/lib/mpvio.install/tools" "$root/bin"; do
            if [ -f "$dir/mpv.exe" ]; then
              win_dir="$(cygpath -w "$dir")"
              echo "$win_dir" >> "$GITHUB_PATH"
              echo "mpv.exe found in $win_dir"
              exit 0
            fi
          done
          found="$(find "$root/lib" -iname mpv.exe 2>/dev/null | head -n 1)"
          if [ -n "$found" ]; then
            win_dir="$(cygpath -w "$(dirname "$found")")"
            echo "$win_dir" >> "$GITHUB_PATH"
            echo "mpv.exe found in $win_dir"
            exit 0
          fi
          echo "::warning::mpv.exe not found under $choco_root after choco install"

      # Only a mpv that answers --version turns the handshake on; otherwise the
      # step warns and skips, so the log never claims a test that did not run.
      - name: Run the IPC handshake against a real mpv
        if: runner.os == 'Windows' && steps.mpv.outcome == 'success'
        timeout-minutes: 3
        run: |
          choco_root="${ChocolateyInstall:-C:\\ProgramData\\chocolatey}"
          root="$(cygpath -u "$choco_root")"
          candidates=("$root/lib/mpvio.install/tools/mpv.exe" "$root/bin/mpv.exe")
          while IFS= read -r found; do
            candidates+=("$found")
          done < <(find "$root/lib" -iname mpv.exe -type f 2>/dev/null)
          for candidate in "${candidates[@]}"; do
            [ -f "$candidate" ] || continue
            export PATH="$(dirname "$candidate"):$PATH"
            echo "Checking $candidate --version"
            if "$candidate" --version; then
              export TTV_TEST_REAL_MPV=1
              go test -count=1 -v -run '^TestRealMPVHandshake$' ./internal/player
              exit $?
            else
              status=$?
              echo "::warning::mpv at $candidate failed --version (exit $status); trying the next candidate"
            fi
          done
          echo "::warning::No runnable mpv.exe found under $choco_root; the real-mpv handshake was NOT run"

      # go test hides t.Logf of a passing test, so this step prints what the kernel
      # answered whether the run above passed or not.
      - name: Report the macOS process table
        if: ${{ !cancelled() && runner.os == 'macOS' }}
        run: go test -count=1 -v -run '^(TestKernel|TestFindOrphans)' ./internal/player
