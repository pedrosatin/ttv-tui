name: CI

on:
  # Push só na main: nas demais branches o pull_request já valida a mudança,
  # e filtrar por branches também deixa as tags (Release) fora do CI.
  push:
    branches: [main]
  pull_request:

# Um push novo no mesmo PR cancela o run anterior. Na main cada push tem grupo
# próprio (o run_id): sem isso, um terceiro push substituiria o run ainda
# pendente do segundo, mesmo sem cancel-in-progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || (github.ref == 'refs/heads/main' && github.run_id) || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  govulncheck:
    name: Govulncheck (root and window)
    runs-on: ubuntu-latest
    container: archlinux:latest
    timeout-minutes: 15
    steps:
      - name: Install window build dependencies
        run: pacman -Syu --noconfirm git gcc pkgconf sdl3 mpv libglvnd
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.4'
          cache: false
      # The binary comes from the cache; the analysis below runs every time.
      - name: Install govulncheck
        uses: ./.github/actions/govulncheck
      - name: Check root module
        env:
          CGO_ENABLED: "0"
        run: |
          govulncheck ./...
          GOOS=windows govulncheck ./...
          GOOS=darwin govulncheck ./...
      - name: Set up window Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: window/go.mod
          cache: false
      - name: Check window module
        working-directory: window
        run: govulncheck ./...

  ci:
    name: Build, Lint & Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TMPDIR: /tmp
      XDG_RUNTIME_DIR: /tmp
      RACE_PACKAGES: ./internal/player ./internal/chat ./internal/kick ./internal/ui ./internal/store
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.4'
          cache: true

      - name: Check module tidiness
        run: go mod tidy -diff

      - name: Build packages
        run: go build ./...

      # The one Linux job also builds for a Unix the app does not support, so no
      # other Linux job has to repeat the build and vet just to carry this step.
      - name: Build for an unsupported Unix
        run: GOOS=freebsd GOARCH=amd64 go build ./...

      - name: Run go vet
        run: go vet ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0

      # The packages in RACE_PACKAGES only run under the race detector below, so
      # they are left out here. Every other package, including new ones, runs
      # here. test-json.sh logs the duration of each package. The race run is
      # the only Linux run of those five: it executes every test of theirs, and
      # none carries a `!race` build tag. macOS and Windows still run them
      # without the detector in the portability matrix.
      - name: Run tests (packages outside the race run)
        run: |
          read -ra race <<< "$RACE_PACKAGES"
          # Fora do <(...): uma falha do go list aqui encerra o passo, em vez de
          # deixar a exclusão vazia e rodar os cinco pacotes de novo.
          exclude=$(go list "${race[@]}")
          list=$(go list ./... | grep -vxFf <(printf '%s\n' "$exclude"))
          test -n "$list"
          mapfile -t packages <<< "$list"
          .github/scripts/test-json.sh common -count=1 "${packages[@]}"

      - name: Run race detector on concurrent packages
        run: |
          read -ra race <<< "$RACE_PACKAGES"
          .github/scripts/test-json.sh race -race -count=1 "${race[@]}"

      - name: Check Linux installer offline
        run: |
          shellcheck packaging/install.sh packaging/install_test.sh .github/scripts/test-json.sh
          bash packaging/install_test.sh

  # The window is its own module: it links SDL3 and libmpv, which only some
  # systems package, so the rest of the build never depends on it.
  window:
    name: Window (Arch)
    runs-on: ubuntu-latest
    container: archlinux:latest
    timeout-minutes: 15
    steps:
      - name: Install build dependencies
        run: pacman -Syu --noconfirm git gcc pkgconf sdl3 mpv libglvnd mesa ttf-dejavu noto-fonts-emoji

      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: window/go.mod
          cache: false

      - name: Build, vet and test
        working-directory: window
        run: |
          go mod tidy -diff
          go build -tags windowtest -buildvcs=false -o /tmp/ttv-tui-window .
          go vet ./...
          go vet -tags windowtest ./...
          go test -buildvcs=false ./...
          go test -tags windowtest -buildvcs=false ./...

      # A janela real, offscreen no llvmpipe do mesa, com GQL, IRC e vídeo de
      # fixture: sem compositor, sem live e sem rede. Cenário marcado com bug
      # conhecido (W1, W4…) aparece como SKIP até a correção chegar.
      - name: Window UX scenarios (offscreen)
        env:
          TMPDIR: /tmp
        run: |
          go vet -tags cenarios ./tools/window-scenarios
          go test -tags cenarios -count=1 -parallel 3 -v ./tools/window-scenarios

  # The release ships the window only for Linux (ADR 0012). These builds keep the
  # Windows (MSYS2 UCRT64) and macOS (Homebrew) code compiling and its tests running.
  window-other:
    name: Window (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install SDL3 and libmpv (macOS)
        if: runner.os == 'macOS'
        run: brew install pkgconf sdl3 mpv

      - name: Install SDL3 and libmpv (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: UCRT64
          path-type: inherit
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-sdl3
            mingw-w64-ucrt-x86_64-mpv
            mingw-w64-ucrt-x86_64-ntldd
            unzip
            zip

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: window/go.mod
          cache: false

      - name: Install govulncheck
        uses: ./.github/actions/govulncheck

      # The default macOS TMPDIR is too long for a Unix socket path.
      - name: Build, vet and test (macOS)
        if: runner.os == 'macOS'
        working-directory: window
        env:
          TMPDIR: /tmp
        run: |
          go mod tidy -diff
          govulncheck ./...
          go build -buildvcs=false -o ttv-tui-window .
          go vet ./...
          go test -buildvcs=false ./...

      # Go's build cache does not hash the C headers and libraries cgo compiles
      # against, so the key carries the installed SDL3, mpv, GCC and pkgconf:
      # a new package version starts a cold cache instead of reusing objects
      # built against the old one. A window/go.sum change alone still restores
      # the newest entry under the same prefix, since Go hashes its own sources.
      # The prefix names the window module, apart from the root module's cache.
      - name: Key the window Go cache (Windows)
        id: go-cache-key
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          manifest=$(pacman -Q mingw-w64-ucrt-x86_64-sdl3 mingw-w64-ucrt-x86_64-mpv \
            mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-pkgconf)
          echo "$manifest"
          echo "gcc $(gcc -dumpfullversion), pkg-config $(pkg-config --version)," \
            "sdl3 $(pkg-config --modversion sdl3), mpv $(pkg-config --modversion mpv)"
          native=$(printf '%s\n' "$manifest" | sha256sum | cut -c1-16)
          {
            echo "prefix=go-window-${RUNNER_OS}-${RUNNER_ARCH}-$(go env GOVERSION)-native-${native}-"
            echo "gocache=$(go env GOCACHE)"
            echo "gomodcache=$(go env GOMODCACHE)"
          } >> "$GITHUB_OUTPUT"

      - name: Restore the window Go cache (Windows)
        id: go-cache
        if: runner.os == 'Windows'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.go-cache-key.outputs.gocache }}
            ${{ steps.go-cache-key.outputs.gomodcache }}
          key: ${{ steps.go-cache-key.outputs.prefix }}${{ hashFiles('window/go.sum') }}
          restore-keys: ${{ steps.go-cache-key.outputs.prefix }}

      # -count=1 keeps the restored cache from replaying test results: only
      # compiled packages come from it, and the tests run every time.
      - name: Build, vet and test (Windows)
        if: runner.os == 'Windows'
        working-directory: window
        shell: msys2 {0}
        env:
          CGO_ENABLED: "1"
        run: |
          go mod tidy -diff
          govulncheck ./...
          go build -buildvcs=false -o ttv-tui-window.exe .
          go vet ./...
          go test -count=1 -buildvcs=false ./...

      # Saved before packaging: the zip build compiles against a libmpv
      # extracted to a new temporary directory on each run, so its cache entries
      # would never be reused.
      - name: Save the window Go cache (Windows)
        if: runner.os == 'Windows' && steps.go-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.go-cache-key.outputs.gocache }}
            ${{ steps.go-cache-key.outputs.gomodcache }}
          key: ${{ steps.go-cache-key.outputs.prefix }}${{ hashFiles('window/go.sum') }}

      - name: Package the Windows zip
        if: runner.os == 'Windows'
        shell: msys2 {0}
        env:
          CGO_ENABLED: "1"
        run: |
          mkdir -p dist-window
          packaging/window-windows.sh dist-window/ttv-tui-window.zip

      # Without MSYS2 on PATH, a DLL missing from the zip stops the process before
      # main. Any other probe result is fine: the runner may lack a usable GPU.
      - name: Check the zip loads without MSYS2
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 3
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'window-zip'
          Expand-Archive -LiteralPath dist-window/ttv-tui-window.zip -DestinationPath $dir
          $allowedDlls = @('libmpv-2.dll', 'SDL3.dll', 'libiconv-2.dll')
          $packagedDlls = Get-ChildItem -Path (Join-Path $dir 'ttv-tui-window') -Filter '*.dll' | Select-Object -ExpandProperty Name
          $unexpected = $packagedDlls | Where-Object { $_ -notin $allowedDlls }
          if ($unexpected) {
            throw "Unexpected DLLs found in zip: $($unexpected -join ', ') (allowed: $($allowedDlls -join ', '))"
          }
          $missing = $allowedDlls | Where-Object { $_ -notin $packagedDlls }
          if ($missing) {
            throw "Missing required DLLs in zip: $($missing -join ', ')"
          }
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          $exe = Join-Path $dir 'ttv-tui-window\ttv-tui-window.exe'
          $p = Start-Process -FilePath $exe -ArgumentList '--probe' -Wait -PassThru -NoNewWindow
          Write-Host "probe exit code: $($p.ExitCode)"
          if ($p.ExitCode -eq -1073741515) { throw 'A DLL is missing from the zip (STATUS_DLL_NOT_FOUND).' }
          if ($p.ExitCode -eq -1073741511) { throw 'A DLL in the zip lacks an entry point (STATUS_ENTRYPOINT_NOT_FOUND).' }

      # Lets a branch be tried on a real Windows before a release has the zip.
      - name: Upload the Windows zip
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ttv-tui-window-windows
          path: dist-window/ttv-tui-window.zip
          if-no-files-found: error
          retention-days: 7

  # Proves on every push that the app and its tests compile on macOS and Windows,
  # and that the suite runs there. Linux is the "Build, Lint & Test" job above,
  # which builds, vets and tests it, so it is not repeated here. The suite needs
  # neither mpv nor streamlink; only the Windows handshake step below uses a
  # real mpv.
  portability:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    # The Windows handshake runs the official mpv build from the mpv release
    # itself, the same release packaging/window-windows.sh takes libmpv from. Its
    # assets come with a maintainer's signature (.asc); the SHA-256 below is the
    # one GitHub lists for the asset and is checked on every run, cached or not.
    env:
      MPV_VERSION: v0.42.0
      MPV_ASSET: mpv-v0.42.0-x86_64-pc-windows-msvc.zip
      MPV_SHA256: 8dd69cbab079086765fa5d873c09513b2834b85d146c1301718a757e8c0595ef
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.4'
          cache: true

      # The default macOS TMPDIR is too long for a Unix socket path.
      - name: Use short temp paths
        if: runner.os != 'Windows'
        run: |
          echo "TMPDIR=/tmp" >> "$GITHUB_ENV"
          echo "XDG_RUNTIME_DIR=/tmp" >> "$GITHUB_ENV"

      - name: Parse Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'packaging/install.ps1'), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }

      - name: Check Windows installer dry run
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $output = & ./packaging/install.ps1 -DryRun -Version 0.2.0 6>&1 | Out-String
          Write-Host $output
          if ($output -notmatch 'Plan: version 0\.2\.0' -or
              $output -notmatch 'ttv-tui_0\.2\.0_windows_amd64\.zip' -or
              $output -notmatch 'checksums\.txt' -or
              $output -notmatch 'Verify SHA-256') { throw 'Unexpected installer dry run output' }

      - name: Build packages
        run: go build ./...

      - name: Run go vet (production and tests)
        run: go vet ./...

      - name: Run tests
        run: go test -count=1 ./...

      # The zip is cached by version and hash, and mpv lands in a fixed
      # directory under the runner's temp, so no step has to search for mpv.exe.
      - name: Restore the portable mpv
        id: mpv-cache
        if: runner.os == 'Windows'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/mpv-zip
          key: mpv-windows-${{ env.MPV_VERSION }}-${{ env.MPV_SHA256 }}

      - name: Install the portable mpv
        if: runner.os == 'Windows'
        timeout-minutes: 3
        run: |
          tmp="$(cygpath -u "$RUNNER_TEMP")"
          zip="$tmp/mpv-zip/$MPV_ASSET"
          if [ ! -f "$zip" ]; then
            mkdir -p "$tmp/mpv-zip"
            curl -fsSL --retry 3 --retry-all-errors --connect-timeout 20 --max-time 120 \
              -o "$zip.part" "https://github.com/mpv-player/mpv/releases/download/$MPV_VERSION/$MPV_ASSET"
            mv "$zip.part" "$zip"
          fi
          echo "$MPV_SHA256 *$zip" | sha256sum -c -
          7z x -y -bso0 -bsp0 -o"$(cygpath -w "$tmp/mpv")" "$(cygpath -w "$zip")"
          test -f "$tmp/mpv/mpv.exe"
          cygpath -w "$tmp/mpv" >> "$GITHUB_PATH"

      - name: Save the portable mpv
        if: runner.os == 'Windows' && steps.mpv-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/mpv-zip
          key: mpv-windows-${{ env.MPV_VERSION }}-${{ env.MPV_SHA256 }}

      - name: Run the IPC handshake against a real mpv
        if: runner.os == 'Windows'
        timeout-minutes: 3
        run: |
          mpv --version
          TTV_TEST_REAL_MPV=1 go test -count=1 -v -run '^TestRealMPVHandshake$' ./internal/player

      # go test hides t.Logf of a passing test, so this step prints what the kernel
      # answered whether the run above passed or not.
      - name: Report the macOS process table
        if: ${{ !cancelled() && runner.os == 'macOS' }}
        run: go test -count=1 -v -run '^(TestKernel|TestFindOrphans)' ./internal/player
