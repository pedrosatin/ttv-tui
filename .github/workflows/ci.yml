name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    name: Build, Lint & Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TMPDIR: /tmp
      XDG_RUNTIME_DIR: /tmp
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build packages
        run: go build ./...

      - name: Run go vet
        run: go vet ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.15.0

      - name: Run tests
        run: go test -count=1 ./...

      - name: Run race detector on concurrent packages
        run: go test -race -count=1 ./internal/player ./internal/chat ./internal/ui ./internal/store

  # Proves on every push that the app and its tests compile on each OS, and that
  # the suite runs there. No job needs mpv, streamlink or the network.
  portability:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # The default macOS TMPDIR is too long for a Unix socket path.
      - name: Use short temp paths
        if: runner.os != 'Windows'
        run: |
          echo "TMPDIR=/tmp" >> "$GITHUB_ENV"
          echo "XDG_RUNTIME_DIR=/tmp" >> "$GITHUB_ENV"

      - name: Build packages
        run: go build ./...

      - name: Run go vet (production and tests)
        run: go vet ./...

      - name: Build for an unsupported Unix
        if: runner.os == 'Linux'
        run: GOOS=freebsd GOARCH=amd64 go build ./...

      - name: Run tests
        run: go test -count=1 ./...

      # go test hides t.Logf of a passing test, so this step prints what the kernel
      # answered whether the run above passed or not.
      - name: Report the macOS process table
        if: ${{ !cancelled() && runner.os == 'macOS' }}
        run: go test -count=1 -v -run '^(TestKernel|TestFindOrphans)' ./internal/player
