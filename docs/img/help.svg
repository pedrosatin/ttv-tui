<text x="14.0" y="327.5" fill="#cdd6f4">=== Keyboard Shortcuts ===                                                                                              </text>
<text x="14.0" y="345.5" fill="#cdd6f4">  Help: ?/Esc/F1/q close </text>
<text x="224.0" y="345.5" fill="#cdd6f4">·</text>
<text x="240.8" y="345.5" fill="#cdd6f4">↑</text>
<text x="249.2" y="345.5" fill="#cdd6f4">/</text>
<text x="257.6" y="345.5" fill="#cdd6f4">↓</text>
<text x="266.0" y="345.5" fill="#cdd6f4"> PgUp/PgDn Home/End scroll                                                                </text>
<text x="14.0" y="363.5" fill="#cdd6f4">  Focused: list </text>
<text x="148.4" y="363.5" fill="#cdd6f4">—</text>
<text x="156.8" y="363.5" fill="#cdd6f4"> after closing help, Tab switches panels and keeps draft                                               </text>
<text x="14.0" y="381.5" fill="#cdd6f4">  List: </text>
<text x="81.2" y="381.5" fill="#cdd6f4">↑</text>
<text x="89.6" y="381.5" fill="#cdd6f4">/</text>
<text x="98.0" y="381.5" fill="#cdd6f4">↓</text>
<text x="106.4" y="381.5" fill="#cdd6f4"> or j/k move </text>
<text x="215.6" y="381.5" fill="#cdd6f4">·</text>
<text x="224.0" y="381.5" fill="#cdd6f4"> Enter open </text>
<text x="324.8" y="381.5" fill="#cdd6f4">·</text>
<text x="333.2" y="381.5" fill="#cdd6f4"> f favorite </text>
<text x="434.0" y="381.5" fill="#cdd6f4">·</text>
<text x="442.4" y="381.5" fill="#cdd6f4"> Tab switch panel                                                    </text>
<text x="14.0" y="399.5" fill="#cdd6f4">  Esc: leaves typing, chat, filter or search                                                                            </text>
<text x="14.0" y="417.5" fill="#cdd6f4">  Back to categories: Esc in the list </text>
<text x="333.2" y="417.5" fill="#cdd6f4">·</text>
<text x="341.6" y="417.5" fill="#cdd6f4"> Ctrl+R anywhere, even while typing                                              </text>
<text x="14.0" y="435.5" fill="#cdd6f4">  Search: / filter list </text>
<text x="215.6" y="435.5" fill="#cdd6f4">·</text>
<text x="224.0" y="435.5" fill="#cdd6f4"> Ctrl+F search (Ctrl+S alt) </text>
<text x="459.2" y="435.5" fill="#cdd6f4">·</text>
<text x="467.6" y="435.5" fill="#cdd6f4"> r retry                                                          </text>
<text x="14.0" y="453.5" fill="#cdd6f4">  Channel filters: l language and audience </text>
<text x="375.2" y="453.5" fill="#cdd6f4">·</text>
<text x="383.6" y="453.5" fill="#cdd6f4"> Enter/Space toggle </text>
<text x="551.6" y="453.5" fill="#cdd6f4">·</text>
<text x="560.0" y="453.5" fill="#cdd6f4"> Esc close                                             </text>
<text x="14.0" y="471.5" fill="#cdd6f4">  Layout: Ctrl+W cycle split/chat/list/focus </text>
<text x="392.0" y="471.5" fill="#cdd6f4">·</text>
<text x="400.4" y="471.5" fill="#cdd6f4"> Ctrl+H toggle list </text>
<text x="568.4" y="471.5" fill="#cdd6f4">·</text>
<text x="576.8" y="471.5" fill="#cdd6f4"> Ctrl+L toggle chat                                  </text>
<text x="14.0" y="489.5" fill="#cdd6f4">  Esc keeps the layout: go back with Ctrl+W, Ctrl+H or Ctrl+L </text>
<text x="534.8" y="489.5" fill="#cdd6f4">·</text>
<text x="543.2" y="489.5" fill="#cdd6f4"> under 80 columns Ctrl+L opens chat only                 </text>
<text x="14.0" y="507.5" fill="#cdd6f4">  Player (TUI and mpv): Space pause </text>
<text x="316.4" y="507.5" fill="#cdd6f4">·</text>
<text x="324.8" y="507.5" fill="#cdd6f4"> +/- volume </text>
<text x="425.6" y="507.5" fill="#cdd6f4">·</text>
<text x="434.0" y="507.5" fill="#cdd6f4"> Ctrl+X stop (TUI only)                                               </text>
<text x="14.0" y="525.5" fill="#cdd6f4">  Chat: </text>
<text x="81.2" y="525.5" fill="#cdd6f4">↑</text>
<text x="89.6" y="525.5" fill="#cdd6f4">/PgUp/Home scroll </text>
<text x="240.8" y="525.5" fill="#cdd6f4">·</text>
<text x="249.2" y="525.5" fill="#cdd6f4"> End/G live </text>
<text x="350.0" y="525.5" fill="#cdd6f4">·</text>
<text x="358.4" y="525.5" fill="#cdd6f4"> y copy </text>
<text x="425.6" y="525.5" fill="#cdd6f4">·</text>
<text x="434.0" y="525.5" fill="#cdd6f4"> i write </text>
<text x="509.6" y="525.5" fill="#cdd6f4">·</text>
<text x="518.0" y="525.5" fill="#cdd6f4"> Ctrl+T reconnect                                           </text>
<text x="14.0" y="543.5" fill="#cdd6f4">  App: Ctrl+Q quit </text>
<text x="173.6" y="543.5" fill="#cdd6f4">·</text>
<text x="182.0" y="543.5" fill="#cdd6f4"> ? or F1 toggle help                                                                                </text>
<text x="14.0" y="561.5" fill="#cdd6f4">  No color: NO_COLOR disables color </text>
<text x="316.4" y="561.5" fill="#cdd6f4">·</text>
<text x="324.8" y="561.5" fill="#cdd6f4"> symbols </text>
<text x="400.4" y="561.5" fill="#cdd6f4">▸</text>
<text x="417.2" y="561.5" fill="#cdd6f4">★</text>
<text x="434.0" y="561.5" fill="#cdd6f4">●</text>
<text x="450.8" y="561.5" fill="#cdd6f4">▶</text>
<text x="467.6" y="561.5" fill="#cdd6f4">‖</text>
<text x="484.4" y="561.5" fill="#cdd6f4">✖</text>
<text x="492.8" y="561.5" fill="#cdd6f4"> ! still show state                                            </text>
<text x="14.0" y="579.5" fill="#cdd6f4">  Colors: </text>
